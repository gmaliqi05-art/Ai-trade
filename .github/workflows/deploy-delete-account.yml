name: Deploy delete-account

# Fshirja e llogarisë me verifikim fjalëkalimi. verify_jwt=true — thirret nga përdorues të kyçur.
# Auto-deploy në main + manual. Kërkon SUPABASE_ACCESS_TOKEN.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/delete-account/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Deploy delete-account (verify_jwt=true)
        run: supabase functions deploy delete-account --project-ref zwyuscgqacfpjafznybg
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
