name: Deploy vip-verify

# Verifikon kodin VIP në server (kodet ruhen te vip_access_codes; s'ekspozohen te klienti).
# verify_jwt=true — thirret nga përdorues të kyçur. Auto-deploy në main + manual.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/vip-verify/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Deploy vip-verify (verify_jwt=true)
        run: supabase functions deploy vip-verify --project-ref zwyuscgqacfpjafznybg
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
