name: Deploy platform-poll

# Lexuesi i feed-it kuant të platformës (GoldSniperFX) → përcjell sinjalet te telegram-signals.
# verify_jwt=false — thirret nga pg_cron (pa JWT).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/platform-poll/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Deploy platform-poll (verify_jwt=false)
        run: supabase functions deploy platform-poll --no-verify-jwt --project-ref zwyuscgqacfpjafznybg
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
