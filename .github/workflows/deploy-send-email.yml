name: Deploy send-email

# Dërguesi qendror i email-eve (Resend). Thirret nga funksionet e brendshme me
# service-role dhe nga admini për provë — prandaj --no-verify-jwt (autorizimi
# bëhet brenda funksionit: service-role OSE profiles.is_admin).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/send-email/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Deploy send-email
        run: supabase functions deploy send-email --project-ref zwyuscgqacfpjafznybg --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
