name: Deploy vip-request

# Kërkesa e përdoruesit për abonim VIP (vip_requests). verify_jwt=true — thirret nga përdorues të kyçur.
# Auto-deploy kur ndryshon kodi në `main`, ose manualisht. Kërkon SUPABASE_ACCESS_TOKEN.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/vip-request/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Deploy vip-request (verify_jwt=true)
        run: supabase functions deploy vip-request --project-ref zwyuscgqacfpjafznybg
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
