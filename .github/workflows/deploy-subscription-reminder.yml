name: Deploy subscription-reminder

# Kujtesa e abonimit (push 7 ditë para skadimit). Thirret nga cron me x-cron-secret → --no-verify-jwt.
# Auto-deploy në main + manual. Kërkon SUPABASE_ACCESS_TOKEN.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/subscription-reminder/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Deploy subscription-reminder (verify_jwt=false — cron)
        run: supabase functions deploy subscription-reminder --no-verify-jwt --project-ref zwyuscgqacfpjafznybg
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
