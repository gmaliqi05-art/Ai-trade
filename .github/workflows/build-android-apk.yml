name: Build Android APK

# Ndërton APK-në e aplikacionit GOLDTRADE (mbështjellësi me bllokim të vërtetë screenshot-esh)
# dhe e publikon te Releases me tag-un fiks 'android-apk' — linku i shkarkimit mbetet i njëjtë.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: cd android && gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GOLDTRADE.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GOLDTRADE-apk
          path: GOLDTRADE.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk
          name: 'GOLDTRADE — Android APK'
          body: |
            APK-ja e fundit e aplikacionit Android GOLDTRADE.

            **Bllokim i vërtetë i screenshot-eve (FLAG_SECURE)** — screenshot-et dhe regjistrimet e ekranit dalin të zeza / refuzohen nga sistemi. Përjashtim vetëm për llogarinë e lejuar.

            **Instalimi:** shkarko `GOLDTRADE.apk` në telefon → hape → lejo "Instalimin nga burime të panjohura" → Instalo.
          files: GOLDTRADE.apk
