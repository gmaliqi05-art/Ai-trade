name: Deploy gold-sniper-post

# Poston sinjale te kanali GoldSniper|FX (bot Telegram si admin).
# verify_jwt=true — autentikohet me JWT-në e përdoruesit.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/gold-sniper-post/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Deploy gold-sniper-post (verify_jwt=true)
        run: supabase functions deploy gold-sniper-post --project-ref zwyuscgqacfpjafznybg
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
