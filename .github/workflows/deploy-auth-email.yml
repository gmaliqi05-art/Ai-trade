name: Deploy auth-email

# Kodi i verifikimit + rivendosja e fjalëkalimit. Rivendosja duhet të jetë PUBLIKE
# (përdoruesi s'është i kyçur), prandaj --no-verify-jwt; verifikimi i kodit e kontrollon
# vetë JWT-në brenda funksionit.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/auth-email/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Deploy auth-email
        run: supabase functions deploy auth-email --project-ref zwyuscgqacfpjafznybg --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
