name: Deploy admin-whatif

# Funksion i Adminit: "po ta kishte lënë siç e dha sinjali, çfarë do të kishte ndodhur".
# verify_jwt=true — identiteti i thirrësit duhet të vijë nga JWT, sepse porta është roli admin.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/admin-whatif/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Deploy admin-whatif
        run: supabase functions deploy admin-whatif --project-ref zwyuscgqacfpjafznybg
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
