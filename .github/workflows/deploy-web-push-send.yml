name: Deploy web-push-send

# Deploy i dërguesit të Web Push (web-push-send). verify_jwt=false — funksioni bën vetë autentikimin
# (service-role/x-cron-secret për thirrjet interne; JWT për butonin "Provo" te vetja).
# Nxitet automatikisht kur ndryshon kodi në `main`, ose manualisht (workflow_dispatch).
# Kërkon sekretin e repos: SUPABASE_ACCESS_TOKEN.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/web-push-send/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Deploy web-push-send (verify_jwt=false — self-auth)
        run: supabase functions deploy web-push-send --project-ref zwyuscgqacfpjafznybg --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
