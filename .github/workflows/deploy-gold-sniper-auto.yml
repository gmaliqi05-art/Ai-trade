name: Deploy gold-sniper-auto

# I ÇAKTIVIZUAR si NO-OP (kërkesa e pronarit): sinjalet e motorit s'postohen më në Telegram.
# Deploy-i mbetet që versioni no-op të jetë live. Auto-deploy në main + manual.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/gold-sniper-auto/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Deploy gold-sniper-auto (verify_jwt=false)
        run: supabase functions deploy gold-sniper-auto --no-verify-jwt --project-ref zwyuscgqacfpjafznybg
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
