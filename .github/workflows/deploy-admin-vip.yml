name: Deploy admin-vip

# Menaxhim VIP nga super-admin (liston përdoruesit + jep/heq is_vip + kodet e qasjes + kërkesat VIP).
# verify_jwt=true — kërkon JWT; funksioni kontrollon edhe që thirrësi është admin.
# Auto-deploy kur ndryshon kodi në `main`, ose manualisht.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/admin-vip/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Deploy admin-vip
        run: supabase functions deploy admin-vip --project-ref zwyuscgqacfpjafznybg
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
