name: Deploy gold-sniper-ingest

# Webhook hyrës: platforma e përdoruesit dërgon sinjale → postohen te kanali GoldSniper|FX.
# verify_jwt=false — autentikimi bëhet me ?key=<ingest_secret>. Nxitet manualisht.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Deploy gold-sniper-ingest (verify_jwt=false)
        run: supabase functions deploy gold-sniper-ingest --no-verify-jwt --project-ref zwyuscgqacfpjafznybg
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
