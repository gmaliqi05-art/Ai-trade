name: Deploy gold-sniper-ingest

# Webhook hyrës: platforma e përdoruesit dërgon sinjale → postohen te kanali GoldSniper|FX
# dhe përcillen te roboti. verify_jwt=false — autentikimi bëhet me ?key=<ingest_secret>.
#
# NXITJA NGA PUSH-I MUNGONTE (5 gusht 2026). Ky workflow kishte VETËM 'workflow_dispatch', pra
# ndryshimet e funksionit shkonin te 'main' dhe rrinin aty derisa dikush kujtohej ta niste me dorë.
# U kap pikërisht te rregullimi i anulimit që s'i mbërrinte robotit: PR-i u merge-ua, prodhimi mbeti
# me versionin e vjetër, dhe urdhrat e mbylljes do të kishin vazhduar të humbnin pa u vënë re.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/gold-sniper-ingest/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Deploy gold-sniper-ingest (verify_jwt=false)
        run: supabase functions deploy gold-sniper-ingest --no-verify-jwt --project-ref zwyuscgqacfpjafznybg
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
